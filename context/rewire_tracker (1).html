<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REWIRE — 12-Week Project Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#f8f7f5;color:#1a1a18;padding:2rem 1rem;line-height:1.5}
.container{max-width:960px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem}
h1{font-size:22px;font-weight:600}
.sub{font-size:13px;color:#888;margin-top:3px}
.prog-wrap{display:flex;align-items:center;gap:10px}
.prog-bar{width:160px;height:6px;background:#e0ddd6;border-radius:3px;overflow:hidden}
.prog-fill{height:100%;background:#1D9E75;border-radius:3px;transition:width .4s}
.prog-lbl{font-size:13px;color:#888}
.people{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1.5rem}
.person{padding:10px;border-radius:10px;border:1px solid #e0ddd6;background:#fff;cursor:pointer;text-align:center;transition:all .15s;user-select:none}
.person .pname{font-size:13px;font-weight:500}
.person .prole{font-size:11px;color:#888;margin-top:2px}
.person.p1.on{border-color:#185FA5;background:#E6F1FB}.person.p1.on .pname{color:#0C447C}
.person.p2.on{border-color:#0F6E56;background:#E1F5EE}.person.p2.on .pname{color:#085041}
.person.p3.on{border-color:#854F0B;background:#FAEEDA}.person.p3.on .pname{color:#633806}
.person.p4.on{border-color:#534AB7;background:#EEEDFE}.person.p4.on .pname{color:#3C3489}
.weeks{display:flex;flex-direction:column;gap:6px}
.wcard{border:1px solid #e0ddd6;border-radius:12px;overflow:hidden;background:#fff}
.wcard.current{border-color:#1D9E75;border-width:2px}
.wheader{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;background:#f8f7f5;user-select:none}
.wdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.wdot.done{background:#1D9E75}
.wdot.current{background:#378ADD}
.wdot.upcoming{background:#ccc}
.wnum{font-size:12px;font-weight:500;color:#888;min-width:54px}
.wtitle{font-size:13px;font-weight:500;flex:1}
.wdate{font-size:11px;color:#aaa;text-align:right;min-width:88px}
.mbadge{font-size:10px;padding:2px 8px;border-radius:20px;background:#faeeda;color:#854F0B;border:1px solid #EF9F27;white-space:nowrap}
.chev{font-size:11px;color:#aaa;transition:transform .2s}
.chev.open{transform:rotate(90deg)}
.wbody{display:none;padding:12px 14px;border-top:1px solid #e0ddd6}
.wbody.open{display:block}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.tblock{padding:8px 10px;border-radius:8px;border-left:3px solid transparent}
.tblock.p1{border-left-color:#378ADD;background:#E6F1FB}
.tblock.p2{border-left-color:#1D9E75;background:#E1F5EE}
.tblock.p3{border-left-color:#BA7517;background:#FAEEDA}
.tblock.p4{border-left-color:#534AB7;background:#EEEDFE}
.tblock.hidden{display:none}
.tperson{font-size:11px;font-weight:600;margin-bottom:5px}
.tblock.p1 .tperson{color:#0C447C}
.tblock.p2 .tperson{color:#085041}
.tblock.p3 .tperson{color:#633806}
.tblock.p4 .tperson{color:#3C3489}
.titems{list-style:none;display:flex;flex-direction:column;gap:4px}
.titems li{font-size:12px;color:#555;display:flex;gap:6px;align-items:flex-start;line-height:1.4}
.titems li::before{content:"";width:4px;height:4px;border-radius:50%;background:#bbb;flex-shrink:0;margin-top:5px}
.cp{margin-top:8px;padding:8px 10px;border-radius:8px;background:#e1f5ee;font-size:12px;color:#085041}
.cp strong{font-weight:600}
.wknd{margin-top:6px;padding:8px 10px;border-radius:8px;background:#f8f7f5;border:1px solid #e0ddd6;font-size:12px;color:#555}
.wknd strong{font-weight:600;color:#1a1a18}
@media(max-width:600px){.tgrid{grid-template-columns:1fr}.people{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="container">
<div class="top">
  <div>
    <h1>REWIRE — 12-week project tracker</h1>
    <div class="sub">Apr 3 – Jun 22 &nbsp;·&nbsp; Team of 4 &nbsp;·&nbsp; Weekend check-ins every Sunday</div>
  </div>
  <div class="prog-wrap">
    <div class="prog-bar"><div class="prog-fill" id="pf" style="width:8%"></div></div>
    <span class="prog-lbl" id="pl">Week 1 of 12</span>
  </div>
</div>

<div class="people">
  <div class="person p1 on" onclick="fp(1,this)"><div class="pname">Person 1</div><div class="prole">Data + pipeline</div></div>
  <div class="person p2 on" onclick="fp(2,this)"><div class="pname">Person 2</div><div class="prole">Graph builder</div></div>
  <div class="person p3 on" onclick="fp(3,this)"><div class="pname">Person 3</div><div class="prole">RSV calculator</div></div>
  <div class="person p4 on" onclick="fp(4,this)"><div class="pname">Person 4</div><div class="prole">Model + demo</div></div>
</div>

<div class="weeks" id="wg"></div>
</div>

<script>

{p:2,l:"Person 2 — Graph builder",items:["Create fake 20-node 50-edge protein CSV with made-up weights","Write ppi_graph.py: build_graph(filepath) and simulate_binding(G, targets, affinities)","Test deep copy — modifying G_drug must not change G₀","Define clean module interface so anyone can import it"]},
{p:3,l:"Person 3 — RSV calculator",items:["Write rsv_compute.py using two random NetworkX graphs as input","Implement: compute_betweenness_shift, compute_community_change, compute_spectral_gap, compute_entropy_delta","Combine into compute_rsv(G0, Gdrug, targets) returning list of 4 floats","Install python-louvain — test community.best_partition on small graph"]},

{p:1,l:"Person 1 — Data pipeline",items:["DrugBank license arrives — parse XML, extract drug → target protein → Ki/Kd triples","Write disease_genes.py: query OpenTargets for 5 test diseases, save as CSV","Output three clean CSVs to shared Drive: ppi.csv, drug_targets.csv, disease_genes.csv","QC: print row counts and sample rows for each file"]},
{p:2,l:"Person 2 — Graph builder",items:["Swap fake CSV for Person 1's real ppi.csv — confirm zero code changes needed","Verify node/edge counts match STRING's published human network stats","Run simulate_binding on Imatinib targets (ABL1, KIT, PDGFRA) — print before/after edge weights","Handle case where target protein is not in STRING graph — skip and warn"]},
{p:3,l:"Person 3 — RSV calculator",items:["Replace fake graphs with Person 2's real G₀ and G_drug output","Run all 4 metrics — note runtime for each, flag anything over 60 seconds","If betweenness is slow, switch to k=500 approximation immediately","Write to terminal: RSV for Imatinib = [x, x, x, x]"]},
{p:4,l:"Person 4 — Model + demo",items:["Replace dummy vectors with real RSVs from Person 3 output","Confirm model forward pass works on 4-dim real input without errors","Write disease query skeleton: disease name → OpenTargets gene list → DRS vector","Test DRS on Parkinson's disease — produces 4-number vector"]}

{n:3,t:"Batch RSV computation",d:"Apr 14–20",s:"upcoming",

wk:"Share: 100-drug RSV matrix loaded on screen. Estimate time for all 8000 drugs.",

cp:"Web UI renders correctly. Type disease, click run, see ranked list and animated network graph.",

tasks:[
{p:1,l:"Person 1 — Data pipeline",items:["Write graph_export.py: exports top-50 node subgraph as JSON for Cytoscape.js","Include node metadata: protein name, centrality before and after, community ID","Keep subgraph to 50 nodes max — larger graphs slow the browser to a crawl"]},

{p:4,l:"Person 4 — Model + demo",items:["Build HTML/CSS frontend: disease text input, run button, ranked results panel, network canvas","Integrate Cytoscape.js: render before/after subgraph with colour-coded rewired nodes","Add RSV radar chart panel per selected drug — shows 4-metric profile","Style clean and readable — use REWIRE name and consistent colour scheme"]}

cp:"10 different diseases tested. All return valid results. No errors. UI loads on 3 browsers.",
wk:"Share: all 4 team members run independently on their own machines. Report any bugs found.",
tasks:[
{p:1,l:"Person 1 — Data pipeline",items:["Run full data pipeline from scratch on a fresh Colab — confirm 100% reproducible","Document all file paths and expected output shapes in README.md","Verify all 50 diseases in the dataset return valid DRS vectors — no silent failures"]},
{p:2,l:"Person 2 — Graph builder",items:["Stress test: run 20 simultaneous disease queries — no memory crashes or timeouts","Fix edge cases: diseases with fewer than 3 associated genes, drugs with no affinity data","Write integration_test.py: automated test of full pipeline on 5 diseases, pass/fail output"]},

tasks:[

cp:"Report formatted to RVCE spec. Demo runs start-to-finish without any manual steps.",
wk:"Share: final formatted PDF + demo link. Practice the 5-minute live demo together as a team.",
tasks:[
{p:1,l:"Person 1 — Data pipeline",items:["Format all figures and tables to RVCE spec: captions below figures, above tables","Compile reference list in IEEE citation order — check every [n] in text has a matching entry","Proofread Chapter 2 and all data sections for grammar and consistency"]},

tasks:[

{p:2,l:"Person 2 — Graph builder",items:["Final code freeze — tag GitHub repository v1.0","Confirm all code runs on a fresh Colab with no local file dependencies","Write final meaningful commit message summarising the complete project"]},
{p:3,l:"Person 3 — RSV calculator",items:["Verify Appendix A.1 source code listings compile and match what is in the GitHub repo","Cross-check report page count, section numbering, and table of contents accuracy","Confirm all 4 team members have signed the declaration page"]},
{p:4,l:"Person 4 — Model + demo",items:["Confirm demo URL is live and accessible on the day of submission","Do one final complete 5-minute run-through — time it, keep it under 5 minutes","Take screenshot of final working UI and save as evidence of working prototype"]}

let active=new Set([1,2,3,4]);

function fp(n,el){
  if(active.has(n)&&active.size===1)return;
  active.has(n)?(active.delete(n),el.classList.remove('on')):(active.add(n),el.classList.add('on'));
  document.querySelectorAll('.tblock').forEach(b=>{b.classList.toggle('hidden',!active.has(parseInt(b.dataset.p)))});
}

function tw(i){
  const b=document.getElementById('b'+i),c=document.getElementById('c'+i);
  const o=b.classList.contains('open');
  b.classList.toggle('open',!o);c.classList.toggle('open',!o);
}

function build(){
  const g=document.getElementById('wg');
  W.forEach((w,i)=>{
    const div=document.createElement('div');
    div.className='wcard'+(w.s==='current'?' current':'');
    const dc=w.s==='done'?'done':w.s==='current'?'current':'upcoming';
    const mb=w.m?`<span class="mbadge">${w.m}</span>`:'';
    div.innerHTML=`<div class="wheader" onclick="tw(${i})">
      <div class="wdot ${dc}"></div>
      <span class="wnum">Week ${w.n}</span>
      <span class="wtitle">${w.t}</span>
      ${mb}
      <span class="wdate">${w.d}</span>
      <span class="chev" id="c${i}">&#9656;</span>
    </div>
    <div class="wbody" id="b${i}">
      <div class="tgrid">
        ${w.tasks.map(t=>`<div class="tblock p${t.p}" data-p="${t.p}">
          <div class="tperson">${t.l}</div>
          <ul class="titems">${t.items.map(x=>`<li>${x}</li>`).join('')}</ul>
        </div>`).join('')}
      </div>
      <div class="cp"><strong>Weekend checkpoint:</strong> ${w.cp}</div>
      <div class="wknd"><strong>Meeting agenda:</strong> ${w.wk}</div>
    </div>`;
    g.appendChild(div);
  });
  tw(0);
}
build();
</script>
</body>
</html>
